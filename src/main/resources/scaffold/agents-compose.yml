services:
  chroma:
    image: chromadb/chroma:1.5.3
    container_name: chroma
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
volumes:
  chroma_data:
    driver: local
